<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>粒子 UI —— 槽位 / 字模</title>
<style>
  html, body { margin: 0; height: 100%; background: #04070d; overflow: hidden; }
  #scene { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; left: 12px; top: 10px; color: #6d7e93;
    font: 11px/1.5 ui-monospace, Menlo, monospace; white-space: pre; pointer-events: none;
  }
  /* 真实输入框：**完全透明**，只保留插入符与命中区。
     文字由粒子画，光标由浏览器画 —— 中文输入法的候选框要靠这个真 caret 定位。 */
  #type {
    position: absolute; display: none;
    background: transparent; border: 0; outline: 0;
    color: transparent; caret-color: #7fd4ff;
    font-family: "DengXian Light", "Microsoft YaHei Light", "PingFang SC", "Microsoft YaHei", ui-sans-serif, sans-serif;
    font-size: 22px; font-weight: 300; letter-spacing: 0;
    padding: 0; margin: 0;
  }
  #type::selection { background: rgba(111, 198, 255, 0.3); }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud"></div>
<input id="type" spellcheck="false" autocomplete="off" />

<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module">
import { Field } from './src/field.js';
import { compileDraw, FONT, FONT_LAT } from './src/draw.js';
import { ParticleText, SlotAllocator, glyph, glyphBudget } from './src/pui.js';

const f = new Field(document.getElementById('scene'));
const hud = document.getElementById('hud');
window.__field = f;

const q = new URLSearchParams(location.search);
const scene = q.get('scene') || 'ui';

const AREA = { w: 780, h: 620 };
const area = () => ({
  w: AREA.w, h: AREA.h,
  x: Math.round((innerWidth - AREA.w) / 2),
  y: Math.round((innerHeight - AREA.h) / 2),
});

const C = {
  ink: '#a9d4f7',
  dim: '#6f93b8',
  line: '#4d7ba8',
  accent: '#7fe3cf',
};

const state = { text: '下载完了告诉我', hover: false, focus: false };
if (q.get('text')) state.text = q.get('text');

/* ───────── 静态图形：compileDraw 只负责"栅格化 + 采样"，分配由我们决定 ───────── */
function shape(spec, a) {
  const pack = compileDraw({ points: spec.points || 900, layers: spec.layers }, a);
  return pack.points.map((p) => ({ x: p.x + a.x, y: p.y + a.y, ink: p.ink ?? 0.6 }));
}

function roundRect(x, y, w, h, r) {
  return `M${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r}`
    + ` V${y + h - r} Q${x + w},${y + h} ${x + w - r},${y + h}`
    + ` H${x + r} Q${x},${y + h} ${x},${y + h - r}`
    + ` V${y + r} Q${x},${y} ${x + r},${y} Z`;
}

function rgb(hex) {
  const s = hex.replace('#', '');
  return [0, 2, 4].map((i) => parseInt(s.slice(i, i + 2), 16) / 255);
}

const BTN = { x: 26, y: 330, w: 148, h: 40, r: 10 };
const FIELD = { x: 26, y: 404, w: 420, h: 46 };

let parts = null;
let pulseAt = 0;
const FREEZE = Number(new URLSearchParams(location.search).get('freeze') || 0);
let lastInput = { wrote: 0, ms: 0, px: 0, chars: 0 };

/* ───────── 搭场景：一次分配槽位，之后只改内容 ───────── */
function build() {
  const a = area();
  const alloc = new SlotAllocator(6400);
  f.slotBegin({ dim: 0.96, dot: 0.95 });

  const framePts = shape({
    points: 820,
    layers: [
      { type: 'path', d: roundRect(0.5, 0.5, AREA.w - 1, AREA.h - 1, 16), width: 1, color: C.line },
      { type: 'line', from: [16, 50], to: [AREA.w - 16, 50], width: 1, color: C.line },
      { type: 'line', from: [26, 190], to: [AREA.w - 26, 190], width: 1, color: C.line },
    ],
  }, a);
  const frameBase = alloc.alloc(framePts.length, 'frame');
  f.slotPut(frameBase, framePts, rgb(C.line));

  const fieldPts = shape({
    points: 260,
    layers: [{ type: 'path', d: roundRect(FIELD.x, FIELD.y, FIELD.w, FIELD.h, 10), width: 1, color: C.line }],
  }, a);
  const fieldBase = alloc.alloc(fieldPts.length, 'field');

  const btnPts = shape({
    points: 240,
    layers: [{ type: 'path', d: roundRect(BTN.x, BTN.y, BTN.w, BTN.h, BTN.r), width: 1, color: C.line }],
  }, a);
  const btnBase = alloc.alloc(btnPts.length, 'btn');

  const mk = (o) => new ParticleText({ field: f, alloc, ...o });
  const title = mk({ x: a.x + 26, y: a.y + 32, size: 21, max: 8, color: C.dim, font: FONT, label: 'title' });
  const date = mk({ x: a.x + AREA.w - 26, y: a.y + 32, size: 15, max: 6, color: C.line, font: FONT_LAT, align: 'right', label: 'date' });
  const big = mk({ x: a.x + 26, y: a.y + 140, size: 68, max: 4, color: C.ink, font: FONT_LAT, label: 'big' });
  const cap = mk({ x: a.x + 26, y: a.y + 166, size: 20, max: 12, color: C.dim, font: FONT, label: 'cap' });
  const body = [0, 1, 2].map((i) => mk({
    x: a.x + 26, y: a.y + 226 + i * 36, size: 24, max: 16, color: C.ink, font: FONT, label: `body${i}`,
  }));
  const btnText = mk({
    x: a.x + BTN.x + BTN.w / 2, y: a.y + BTN.y + BTN.h / 2 + 2, size: 22, max: 5,
    color: C.dim, align: 'center', font: FONT, label: 'btnText',
  });
  const input = mk({ x: a.x + FIELD.x + 14, y: a.y + FIELD.y + 30, size: 22, max: 22, color: C.ink, font: FONT, label: 'input' });

  parts = { a, alloc, frameBase, fieldBase, btnBase, framePts, fieldPts, btnPts, title, date, big, cap, body, btnText, input };

  title.set('服务器状态');
  date.set('10-17');
  big.set('71%');
  cap.set('CPU 峰值 · 持续 4 小时');
  ['n8n 的一个工作流在反复重启，', '已经把并发从 8 降到 3。', '内存最低还剩 3.1 GB。'].forEach((t, i) => body[i].set(t));
  paintBtn();
  paintField();
  paintInput({ silent: true, initial: true });
  layoutOverlay();
  hudAll();
  /* 截图用：?pulse=x,y&freeze=毫秒 —— 在 x,y 处敲一下，然后在 freeze 毫秒处冻住物理，
     这样同一场扰动的不同瞬间都能拍下来（静态图拍不出惯性，只能逐帧冻结）。 */
  if (q.get('pulse')) {
    const [px, py] = q.get('pulse').split(',').map(Number);
    /* 必须等界面落定再敲：UI 是从球面飞过来的，早敲只会拍到一团乱飞 */
    setTimeout(() => {
      f.impulse(px, py, { r: Number(q.get('pr') || 200), power: Number(q.get('power') || 620) });
      pulseAt = performance.now();
    }, Number(q.get('delay') || 1400));
  }

  /* 截图用：?hover=x,y 摆一个常驻势阱（局部坐标），?swirl=1 加强旋度 */
  if (q.get('hover')) {
    const [hx, hy] = q.get('hover').split(',').map(Number);
    const k = Number(q.get('k') || 1500);
    f.setWells([{ x: hx, y: hy, r: Number(q.get('r') || 190), k, swirl: Number(q.get('swirl') || 0.28) }]);
  }
  return parts;
}

function paintField() {
  f.slotPut(parts.fieldBase, parts.fieldPts, rgb(state.focus ? C.accent : C.line));
}

function paintBtn() {
  const p = parts;
  f.slotPut(p.btnBase, p.btnPts, rgb(state.hover ? C.accent : C.line));
  p.btnText.set('查看日志', { color: state.hover ? C.accent : C.dim, force: true });
}

function paintInput(opt = {}) {
  const r = parts.input.set(state.text, { scl: state.text ? 1 : 0.55, spawn: !opt.initial });
  lastInput = r;
  if (!opt.silent) hudAll(r);
  return r;
}

function hudAll(r = lastInput) {
  hud.textContent = [
    `scene     ${scene} · 槽位/字模`,
    `slots     ${parts.alloc.used} / 6400`,
    `last key  ${r.wrote} 字重写  ${r.ms.toFixed(1)}ms`,
    `text      ${state.text.length} 字  ${Math.round(r.px)}px`,
  ].join('\n');
}

/* ───────── 输入 ───────── */
const typeEl = document.getElementById('type');

function layoutOverlay() {
  const a = parts.a;
  typeEl.style.display = 'block';
  typeEl.style.left = a.x + FIELD.x + 14 + 'px';
  typeEl.style.top = a.y + FIELD.y + 9 + 'px';
  typeEl.style.width = FIELD.w - 28 + 'px';
  typeEl.style.height = FIELD.h - 18 + 'px';
  typeEl.style.lineHeight = FIELD.h - 18 + 'px';
}

typeEl.value = state.text;
typeEl.addEventListener('input', () => {
  state.text = typeEl.value.slice(0, 22);
  paintInput();
});
typeEl.addEventListener('focus', () => { state.focus = true; paintField(); });
typeEl.addEventListener('blur', () => { state.focus = false; paintField(); });

/* ───────── 交互：不写 hover 状态，只放势阱 ─────────
   光标本身是一个弱井（扫过时字会被带歪再弹回，背景也跟着弯腰）；
   移到按钮上时，按钮中心再多一个强井 —— 粒子被吸拢，形成"可以按的东西"，
   而不是靠变色告诉你"这里可以点"。 */
const WELL_CURSOR = { r: 190, k: 1500, swirl: 0.28 };
const WELL_TARGET = { r: 120, k: 3400, swirl: 0.55 };

function wellsAt(x, y) {
  const out = y == null ? [] : [{ x, y, ...WELL_CURSOR }];
  if (x != null && inBtn(x, y)) {
    out.push({ x: BTN.x + BTN.w / 2, y: BTN.y + BTN.h / 2, ...WELL_TARGET });
  }
  return out;
}

function inBtn(x, y) {
  return x > BTN.x && x < BTN.x + BTN.w && y > BTN.y && y < BTN.y + BTN.h;
}

function setPointer(x, y) {
  if (!parts) return;
  f.setWells(wellsAt(x, y));
}

addEventListener('pointermove', (e) => {
  if (!parts) return;
  const { a } = parts;
  const x = e.clientX - a.x;
  const y = e.clientY - a.y;
  setPointer(x, y);
  const on = inBtn(x, y);
  if (on !== state.hover) { state.hover = on; paintBtn(); }
  if (x > FIELD.x && x < FIELD.x + FIELD.w && y > FIELD.y && y < FIELD.y + FIELD.h) typeEl.style.cursor = 'text';
});
addEventListener('pointerleave', () => { if (parts) f.setWells([]); });

addEventListener('pointerdown', (e) => {
  if (!parts) return;
  const { a } = parts;
  const x = e.clientX - a.x;
  const y = e.clientY - a.y;
  /* 按下的第一件事是**给场一个冲量**，不是改状态：粒子炸开，弹簧再把它们收回去。
     状态（换文案/提交）在这之后才发生 —— 所以"按下去有回响"。 */
  f.impulse(x, y, { r: 190, power: 620 });
  if (inBtn(x, y)) {
    state.hover = true;
    paintBtn();
    setTimeout(() => { if (parts) f.impulse(BTN.x + BTN.w / 2, BTN.y + BTN.h / 2, { r: 130, power: 300 }); }, 160);
  }
  if (x > FIELD.x && x < FIELD.x + FIELD.w && y > FIELD.y && y < FIELD.y + FIELD.h) typeEl.focus();
});

/* ───────── 主循环 ───────── */
let last = performance.now();
let frames = 0;
let fpsT = 0;
function loop(now) {
  let dt = Math.min((now - last) / 1000, 0.05);
  /* 冻结：到达指定时刻后 dt=0，物理停住但画面继续画 —— 于是可以随时截图 */
  if (FREEZE && pulseAt && now - pulseAt > FREEZE) dt = 0;
  last = now;
  f.step(dt);
  f.render();
  frames++;
  fpsT += dt;
  if (fpsT > 0.5) { window.__fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; }
  requestAnimationFrame(loop);
}

let rt = null;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 220); });

setTimeout(() => {
  build();
  requestAnimationFrame(loop);
}, 250);

/* 自动化：逐字输入，返回每次真正重写了几个字、花了多久 */
window.__type = (full) => {
  const out = [];
  let prev = state.text;
  for (const ch of full) {
    prev += ch;
    typeEl.value = prev;
    state.text = prev.slice(0, 22);
    const t0 = performance.now();
    const r = paintInput({ silent: true });
    out.push({ ch, wrote: r.wrote, ms: +(performance.now() - t0).toFixed(2) });
  }
  hudAll();
  return out;
};
window.__clear = () => {
  typeEl.value = '';
  state.text = '';
  return paintInput();
};
window.__state = state;
window.__hover = (x, y) => { setPointer(x - 0, y - 0); return f.wells.length; };
window.__clickAt = (x, y) => { f.impulse(x, y, { r: 200, power: 700 }); return true; };
window.__glyph = (ch, size, o) => { const g = glyph(ch, size, o); return { n: g.pts.length, adv: +g.advance.toFixed(2), cell: +g.cell.toFixed(2), budget: g.budget, xs: [Math.min(...g.pts.map(p=>+p.x.toFixed(1))), Math.max(...g.pts.map(p=>+p.x.toFixed(1)))], ys: [Math.min(...g.pts.map(p=>+p.y.toFixed(1))), Math.max(...g.pts.map(p=>+p.y.toFixed(1)))] }; };
window.__parts = () => parts && { slots: parts.alloc.used, base: parts.input.base };
</script>
</body>
</html>
