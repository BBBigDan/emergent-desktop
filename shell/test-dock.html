<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dock icons only</title>
<link rel="stylesheet" href="./src/style.css">
<style>
  body { background: #05080e; }
  /* 预览用：把 dock 放在中间，另外排一行放大图看清字形 */
  #dock { bottom: 40px; }
  #big { position: fixed; left: 50%; top: 60px; transform: translateX(-50%); display: flex; gap: 22px; }
  .bigcell { text-align: center; }
  .bigcell canvas { display: block; background: #070b12; border-radius: 8px; }
  .bigcell span { font-size: 10px; color: #64808f; }
</style>
</head>
<body>
<div id="dock"></div>
<div id="big"></div>

<script type="module">
import { createDockIcon } from './src/dockicon.js';

const APPS = [
  ['files', '文件'],
  ['appstore', '应用市场'],
  ['settings', '设置'],
  ['vault', '保险库'],
  ['profile', '个人资料'],
  ['dashboard', '仪表盘'],
  ['control-hub', '控制面板'],
];

const dock = document.getElementById('dock');
const icons = [];

for (const [name, title] of APPS) {
  const b = document.createElement('button');
  b.className = 'dock-item';
  b.title = title;
  const slot = document.createElement('span');
  slot.className = 'dock-icon';
  b.appendChild(slot);
  const ic = createDockIcon(slot, { name, title, size: 52 });
  icons.push(ic);
  b.addEventListener('pointerenter', () => ic.setHover(true));
  b.addEventListener('pointerleave', () => ic.setHover(false));
  b.addEventListener('click', () => ic.burst());
  dock.appendChild(b);
}
{
  const b = document.createElement('button');
  b.className = 'dock-item dock-logout';
  b.title = '登出';
  const slot = document.createElement('span');
  slot.className = 'dock-icon';
  b.appendChild(slot);
  const ic = createDockIcon(slot, { glyph: 'power', title: '登出', size: 52 });
  b.__icon = ic;
  b.addEventListener('pointerenter', () => ic.setHover(true));
  b.addEventListener('pointerleave', () => ic.setHover(false));
  dock.appendChild(b);
}

/* 放大预览：同一字形 132px，看它到底画成了什么 */
const big = document.getElementById('big');
for (const [name, title] of [...APPS, ['power', '登出']]) {
  const cell = document.createElement('div');
  cell.className = 'bigcell';
  const slot = document.createElement('span');
  cell.appendChild(slot);
  const l = document.createElement('span');
  l.textContent = title;
  cell.appendChild(l);
  big.appendChild(cell);
  createDockIcon(slot, { glyph: name, title, size: 132 });
}

window.__icons = icons;
window.__dock = dock;
</script>
</body>
</html>
