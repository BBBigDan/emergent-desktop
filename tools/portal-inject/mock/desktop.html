<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Mock Desktop · 粒子门注入测试</title>
<style>
  :root { --bg:#070a12; --ink:#dce7f7; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  body::before {
    /* 桌面壁纸：不用图片，避免依赖 */
    content:""; position:fixed; inset:0;
    background:
      radial-gradient(60% 60% at 18% 12%, rgba(46,96,190,.28), transparent 70%),
      radial-gradient(50% 50% at 82% 78%, rgba(20,150,170,.18), transparent 70%),
      radial-gradient(40% 40% at 60% 40%, rgba(90,60,190,.14), transparent 70%);
  }
  .desktop-box { position:fixed; inset:0; }

  .dock { position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
    display:flex; gap:14px; padding:10px 16px; border-radius:18px;
    background:rgba(18,26,44,.68); border:1px solid rgba(120,180,255,.16);
    backdrop-filter:blur(10px); z-index:50; }
  .dock i { width:38px; height:38px; border-radius:11px; display:block; opacity:.9;
    background:linear-gradient(150deg, rgba(120,190,255,.55), rgba(50,90,180,.35)); }
  .dock i:nth-child(2){ background:linear-gradient(150deg, rgba(150,255,220,.45), rgba(40,140,120,.3)); }
  .dock i:nth-child(3){ background:linear-gradient(150deg, rgba(255,190,140,.45), rgba(160,90,40,.3)); }

  /* ==== 与 Olares BasicWindow 对齐的结构 ==== */
  .iframe-box { position:absolute; border-radius:14px; overflow:hidden;
    background:#070b14; box-shadow:0 0 0 1px rgba(126,196,255,.22), 0 24px 70px rgba(0,0,0,.55); }
  .iframe-box .title { height:40px; display:flex; align-items:center; gap:10px; padding:0 12px;
    background:#0d1422; border-bottom:1px solid rgba(126,196,255,.12); font-size:13px; color:#c9d8ee; }
  .iframe-box .title .dot { width:9px; height:9px; border-radius:50%; background:#5ac8fa; box-shadow:0 0 10px #5ac8fa; }
  .iframe-box .title .spacer { flex:1; }
  .iframe-box .title .btn { width:12px; height:12px; border-radius:3px; border:1px solid rgba(200,220,255,.45); }
  .iframe-box > iframe { width:100%; height:calc(100% - 40px); border:0; display:block; background:#070b14; }

  #hint { position:fixed; left:16px; top:14px; font-size:12px; line-height:1.7; color:#8fa6c4;
    background:rgba(10,16,28,.62); border:1px solid rgba(120,180,255,.14);
    padding:10px 14px; border-radius:10px; z-index:60; }
  #hint b { color:#cfe4ff; font-weight:600; }
  #hint button { margin-top:6px; margin-right:6px; background:rgba(60,120,220,.25); color:#cfe4ff;
    border:1px solid rgba(120,180,255,.3); border-radius:6px; padding:3px 9px; font-size:12px; cursor:pointer; }
</style>
</head>
<body>
<div class="desktop-box">
  <div class="iframe-box" id="win1" style="left:120px; top:90px; width:900px; height:560px; z-index:10;">
    <div class="title"><span class="dot"></span><span>Files</span><span class="spacer"></span><i class="btn"></i><i class="btn"></i><i class="btn"></i></div>
    <iframe class="iframe-window" src="/demo/demo-dashboard.html"></iframe>
  </div>
  <div class="dock"><i></i><i></i><i></i></div>
</div>

<div id="hint">
  <b>Mock Desktop</b> — 用来验证注入层，结构与 Olares <code>BasicWindow.vue</code> 一致<br>
  <button onclick="__OP__.replay()">重播</button>
  <button onclick="__OP__.scatter()">散开</button>
  <button onclick="addWindow()">再开一个窗口</button>
  <div style="margin-top:6px;opacity:.7">?op-at=1.6&amp;op-freeze=1 定格 · ?op-n=4000 改粒子数</div>
</div>

<script src="/bundle.js"></script>
<script>
  let n = 1;
  function addWindow() {
    n++;
    const w = document.createElement('div');
    w.className = 'iframe-box';
    w.style.cssText = `left:${180 + n * 40}px;top:${120 + n * 30}px;width:760px;height:480px;z-index:${10 + n};`;
    w.innerHTML = `<div class="title"><span class="dot"></span><span>Window ${n}</span><span class="spacer"></span><i class="btn"></i><i class="btn"></i></div>
      <iframe class="iframe-window" src="/demo/demo-dashboard.html"></iframe>`;
    document.querySelector('.desktop-box').appendChild(w);
  }
</script>
</body>
</html>
