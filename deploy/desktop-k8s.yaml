# 涌现式桌面 · 一个工作负载把官方桌面换掉
#
# 定位：这是**社区版桌面的替换层**，不是市场里的一个应用。换桌面这件事本来就不是
# 给"点两下"的用户做的 —— 它要么由装机的人做，要么让用户自己敲一条命令。
# 所以这里不追求 entrance、不追求市场卸载入口，追求的是：
#   1. 一条命令装，一条命令回滚
#   2. 挂了会自己回来
#   3. 数据在用户的 Home 里（Files 里看得见），重装不丢
#
# 为什么是 ReplicaSet，不是 Deployment：
#   Olares 的 `appns-validating-webhook` 只拦 deployments / statefulsets / daemonsets
#   的 CREATE（实测：规则里就这三个 resource，verbs 只有 CREATE）。
#   裸 Pod 能过，但裸 Pod 不会自愈 —— 节点重启、手滑 delete 之后桌面就死在那儿，
#   而"桌面不见了"没有任何地方会报错。ReplicaSet 能过，而且删 pod 10 秒自己回来（实测）。
#
# 为什么三件事挤在一个 pod 里（nginx / agent / memory）：
#   桌面入口 `edge-desktop` 的 selector 只在**本命名空间**内生效，所以壳层必须跑在
#   user-space 里；而 agent 一旦分到别的命名空间，nginx 就得跨命名空间调它，
#   于是又要 NetworkPolicy 白名单（上一版为此给壳层打了 `tier: bfl` 标签去蹭平台的规则，
#   那是冒充桌面网关）。同一个 pod 里走 127.0.0.1，这些全都不需要。
#
# 装：bash deploy/install.sh        回滚：bash deploy/install.sh --revert
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: emergent-desktop-nginx
  namespace: user-space-bbbigdan
data:
  emergent-desktop.conf: |
    map $http_upgrade $ed_connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 91;
        server_name _;
        root /www;
        index index.html;

        # 官方前端打的是 gzip off，25MB js 裸传。这里由我们这层补压缩：
        # 反代时 upstream 拿到的请求不带 Accept-Encoding，回的是原始体，
        # 所以 gzip_proxied any 让 nginx 自己压一遍再发给浏览器（约 4x 收益）。
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml application/javascript application/json
                   application/xml application/wasm image/svg+xml application/manifest+json;

        # 壳层本身：不缓存，改完刷新即生效
        location / {
            try_files $uri $uri/index.html /index.html;
            add_header Cache-Control "private,no-cache";
        }

        # agent：同一个 pod 里的 127.0.0.1:8788。前缀不剥 —— agent 自己认 /agent/
        # （见 server.mjs 开头），这样它的接口不会和官方 olares-app 的 /api/* 抢路径。
        #
        # 三个必须：proxy_buffering off（下行是 SSE，缓冲了事件就攒着一起发）、
        # proxy_read_timeout 长（一轮对话可能几十秒没数据）、
        # gzip 别碰 text/event-stream（gzip_types 里没有它，天然安全）。
        location /agent/ {
            proxy_pass http://127.0.0.1:8788/agent/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 长连接：必须不缓冲
        location ~ ^/(socket\.io|ws|websocket)/ {
            proxy_pass http://olares-app-official.user-space-bbbigdan.svc.cluster.local:91;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $ed_connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # 设备遥测：官方前端 pod 自己不代理 /bfl（桌面是跨域走 auth 域名 + JWT 的），
        # 所以这里直接打到 bfl 网关，浏览器带着同域 cookie 过去即可。
        location /bfl/ {
            proxy_pass http://bfl.user-space-bbbigdan.svc.cluster.local;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
        }

        # 其余全部交回官方前端 pod，登录态、接口、静态资源都不受影响
        location ~ ^/(api|server|kapis|market-backend|static|js|css|fonts|assets)/ {
            proxy_pass http://olares-app-official.user-space-bbbigdan.svc.cluster.local:91;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $ed_connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            # 静态资源先缓冲再压，压缩率更高、上游连接释放更快
            proxy_buffering on;
            proxy_buffers 8 64k;
            proxy_busy_buffers_size 128k;
            proxy_read_timeout 3600s;
        }
    }
---
# 官方前端 pod 的稳定入口（selector 只命中官方 pod），供上面 proxy_pass 使用
apiVersion: v1
kind: Service
metadata:
  name: olares-app-official
  namespace: user-space-bbbigdan
spec:
  selector:
    app: olares-app
  ports:
    - port: 91
      targetPort: 91
---
# agent 读集群用的身份。要读整个集群（"机器怎么样"的答案不在一个 namespace 里），
# 但**没有删除权**：重启是 patch deployment 的 pod template，授权面从"删任意对象"
# 缩到"触发一次滚动"。审批门挡得住模型乱来，挡不住进程被控。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: emergent-desktop
  namespace: user-space-bbbigdan
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: emergent-desktop-read
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # 诊断"为什么没起来"要看事件：ImagePullBackOff 的 pod 根本没有日志
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  # Prometheus 走 API 的 service proxy，权限是 services/proxy 而不是 services
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: emergent-desktop-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: emergent-desktop-read
subjects:
  - kind: ServiceAccount
    name: emergent-desktop
    namespace: user-space-bbbigdan
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: emergent-desktop
  namespace: user-space-bbbigdan
  labels:
    app: emergent-desktop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emergent-desktop
  template:
    metadata:
      labels:
        app: emergent-desktop
        # **别加 `tier: bfl`。** 踩过一次：为了过应用命名空间的 NetworkPolicy，
        # 给壳层 pod 打了这个标签，结果 `bfl` 这个 Service 的 selector 就是
        # `tier: bfl` —— 壳层立刻被塞进 bfl 的 endpoints，一半请求打到不监听 8080
        # 的 nginx 上，市场 API 直接 400 connection refused。
        # 现在的架构里 agent 在同一个 pod（127.0.0.1），根本不需要那个标签。
    spec:
      serviceAccountName: emergent-desktop
      # 代码不在镜像里：节点上没有 docker/nerdctl/buildah，也没有可推的仓库 ——
      # 打不了镜像。tar 到 hostPath、重启进程即生效，这是这条路的既定代价。
      initContainers:
        - name: check-code
          image: docker.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              if [ ! -f /app/agent/server.mjs ]; then
                echo "代码还没铺。在仓库里跑一次：bash deploy/install.sh"
                exit 1
              fi
          volumeMounts:
            - name: app
              mountPath: /app
      containers:
        # ── 壳层：静态 + 把官方接口转回去 ──
        - name: shell
          image: docker.io/beclab/docker-nginx-headers-more:ubuntu-v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 91
              name: http
          volumeMounts:
            - name: www
              mountPath: /www
            - name: conf
              mountPath: /etc/nginx/conf.d/emergent-desktop.conf
              subPath: emergent-desktop.conf
          readinessProbe:
            tcpSocket:
              port: 91
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}

        # ── agent：粒子场的服务端 ──
        - name: agent
          image: docker.io/library/node:22-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /app
          # 不用 shell 包一层：node 收到 SIGTERM 才会走完 idle 落盘
          command: ["node", "/app/agent/server.mjs"]
          ports:
            - containerPort: 8788
          env:
            - name: PORT
              value: "8788"
            # 静态文件只有一份（www），nginx 和 agent 都读它
            - name: WEB_ROOT
              value: /www
            - name: SYS
              value: k8s
            # 用户 Home 直接挂在 /userspace —— 不是挂整个 userspace 再自己去找
            # pvc-userspace-* 前缀。多用户时前者只能看到自己的数据。
            - name: FS_ROOT
              value: /userspace
            - name: MEMORY_DIR
              value: /userspace/Agent/memory
            - name: MEMORY_STORE
              value: axolotl
            - name: MEMORY_URL
              value: http://127.0.0.1:7801
            - name: TZ
              value: Asia/Shanghai
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # 模型 key 走 Secret，不写进 yaml
          envFrom:
            - secretRef:
                name: emergent-desktop-env
                optional: true
          volumeMounts:
            - name: app
              mountPath: /app
            - name: www
              mountPath: /www
              readOnly: true
            # prompt.mjs 要 `../shell/src/timing.js` —— 那张常数表一份代码三个身份
            # （页面动画 / 提示词里的规范 / Pacer）。把同一个 hostPath 再挂到
            # /app/shell，比复制一份 shell 到代码目录更不容易漂移。
            - name: www
              mountPath: /app/shell
              readOnly: true
            - name: userspace
              mountPath: /userspace
          readinessProbe:
            httpGet:
              path: /agent/api/health
              port: 8788
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8788
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 800m, memory: 512Mi}

        # ── 记忆侧车：真图库。wheel 是 cp311，别"顺手升一下" ──
        - name: memory
          image: docker.io/library/python:3.11-slim
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["python3", "/app/agent/memsvc/server.py"]
          env:
            - name: PYTHONPATH
              value: /py
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PORT
              value: "7801"
            - name: AX_DB
              value: /userspace/Agent/memory/memory.axeb
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: app
              mountPath: /app
            - name: userspace
              mountPath: /userspace
            - name: py
              mountPath: /py
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}

      volumes:
        # 壳层静态文件 + agent 代码（不同目录，同一个根，方便一次 tar 上去）
        - name: www
          hostPath:
            path: /olares/emergent-desktop/www
            type: DirectoryOrCreate
        - name: app
          hostPath:
            path: /olares/emergent-desktop/app
            type: DirectoryOrCreate
        # 用户 Home：记忆库、人格设定、drift 记录都在这里，Files 里看得见。
        # 路径里的随机后缀不能猜，install.sh 会先用真实路径替换 __USER_HOME__ 再 apply。
        # （直接 kubectl apply 这个文件会失败，这是故意的：猜错的后果是
        #   "跑起来了、数据写进了另一个目录"，而界面上看不出来。）
        - name: userspace
          hostPath:
            path: __USER_HOME__
            type: Directory
        - name: py
          hostPath:
            path: /olares/emergent-py
            type: DirectoryOrCreate
        - name: conf
          configMap:
            name: emergent-desktop-nginx
