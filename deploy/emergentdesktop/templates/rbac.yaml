# 它要读整个集群的状态（用户问"机器怎么样"，答案不在一个 namespace 里），
# 但**不该有删除权**。
#
# 上一版 ClusterRole 里有 `pods: delete` —— 为的是 k8s_restart（删 pod 让控制器重建）。
# 代价是这个 pod 被攻破时，它可以删掉任何 namespace 的任何 pod，包括 os-* 里的系统组件。
# 审批门能挡住"模型乱来"，挡不住"agent 进程被控"。
#
# 现在重启改成 rollout restart（patch deployment 的 pod template annotation）：
# 授权面从"删任意对象"缩到"触发一次滚动"。删不掉的，也就删不掉。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: emergentdesktop
  namespace: '{{ .Release.Namespace }}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: emergentdesktop-read
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # 诊断"为什么没起来"要看事件：ImagePullBackOff 的 pod 根本没有日志
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  # Prometheus 走 API 的 service proxy，权限是 services/proxy 而不是 services
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  # 只为 k8s_restart。patch 的效果上限是"让它重启一次"，
  # 而 delete 的上限是"让它消失" —— 这是两个量级。
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: emergentdesktop-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: emergentdesktop-read
subjects:
  - kind: ServiceAccount
    name: emergentdesktop
    namespace: '{{ .Release.Namespace }}'
