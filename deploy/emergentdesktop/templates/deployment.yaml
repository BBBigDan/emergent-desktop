# 从裸 Pod 换成 Deployment，不是为了"更正规"，是为了**自愈**。
#
# 裸 Pod 的代价：节点重启、进程崩、手滑 delete，它都不会自己回来 ——
# 用户看到的是"桌面里那个东西不见了"，而且没有任何地方告诉他为什么。
#
# strategy: Recreate 而不是 RollingUpdate：这个服务有**单例状态**
# （当前这一屏、正在跑的那一轮、内存里的 session）。两个副本同时活着时，
# 前端 SSE 会连到其中一个，而另一个在写同一份 session 文件 —— 屏幕会跳。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emergentdesktop
  namespace: '{{ .Release.Namespace }}'
  labels:
    app: emergentdesktop
    io.kompose.service: emergentdesktop
spec:
  replicas: {{ .Values.workloads.emergentdesktop.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: emergentdesktop
  template:
    metadata:
      labels:
        app: emergentdesktop
        io.kompose.service: emergentdesktop
    spec:
      serviceAccountName: emergentdesktop
      # 代码不在镜像里（见 deploy/README.md 的"为什么还是 hostPath"）。
      # 没有这一步，代码没铺时用户看到的是 node 的 MODULE_NOT_FOUND 堆栈，
      # 而那行报错只说"找不到模块"，不会告诉他该跑什么。
      initContainers:
        - name: check-code
          image: {{ .Values.image.check }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              if [ ! -f /app/agent/server.mjs ]; then
                echo "代码还没铺到 appData。在仓库里跑一次："
                echo "  bash deploy/install.sh"
                echo "（它会把这个应用的文件同步到 Data/emergentdesktop）"
                exit 1
              fi
          volumeMounts:
            - name: app
              mountPath: /app
      # 代码在 appData、用户数据在 Home，两个都是节点上的目录；
      # 换节点时 pod 能起来，但代码要重新 tar 一次（见 deploy/README.md）
      containers:
        - name: agent
          image: {{ .Values.image.agent }}
          imagePullPolicy: IfNotPresent
          workingDir: /app
          # 不用 shell 包一层：node 收到 SIGTERM 才会走完 idle 落盘
          command: ["node", "/app/agent/server.mjs"]
          ports:
            - containerPort: 8788
              name: http
          env:
            - name: PORT
              value: "8788"
            # 页面在 /app/shell，于是页面里的 ./src/x.js 对应 /src/x.js
            - name: WEB_ROOT
              value: /app/shell
            - name: SYS
              value: k8s
            # 用户 Home 直接挂在 /userspace —— 不是挂整个 userspace 再自己去
            # 找 pvc-userspace-* 前缀。多用户时前者只能看到自己的数据，
            # 后者能看到所有人的（这台是单用户，但代码不该依赖这个事实）。
            - name: FS_ROOT
              value: /userspace
            - name: MEMORY_DIR
              value: /userspace/Agent/memory
            # 这里**不传**用户名。v3 清单禁止模板里出现那个变量的名字（lint 会拒），
            # 而 agent 侧本来就能从命名空间后缀推断用户名 ——
            # 装到哪个用户下，看到的就是哪个用户的命名空间，比写死一个名字更对。
            - name: MEMORY_STORE
              value: axolotl
            - name: MEMORY_URL
              value: http://127.0.0.1:7801
            - name: TZ
              value: Asia/Shanghai
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # 模型 key 走 Secret，不写进镜像也不写进 chart。
          # 装的时候：kubectl create secret generic emergentdesktop-env \
          #   --from-literal=MODEL_KEY=sk-... -n <ns>
          envFrom:
            - secretRef:
                name: emergentdesktop-env
                optional: true
          volumeMounts:
            - name: app
              mountPath: /app
            - name: userspace
              mountPath: /userspace
          readinessProbe:
            httpGet:
              path: /agent/api/health
              port: 8788
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8788
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources.agent | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false

        # ── 记忆侧车：真图库 ──
        # wheel 是 cp311，所以这里必须是 python:3.11，别"顺手升一下"。
        - name: memory
          image: {{ .Values.image.memory }}
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["python3", "/app/agent/memsvc/server.py"]
          ports:
            - containerPort: 7801
              name: mem
          env:
            - name: PYTHONPATH
              value: /py
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PORT
              value: "7801"
            # 直接给图文件路径，不走"扫 userspace 找 pvc-*"那条推导
            - name: AX_DB
              value: /userspace/Agent/memory/memory.axeb
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: app
              mountPath: /app
            - name: userspace
              mountPath: /userspace
            - name: py
              mountPath: /py
          resources:
            {{- toYaml .Values.resources.memory | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false

      volumes:
        # 代码 + sessions + usage 账本。appData 由安装器给
        # （.../Data/emergentdesktop），目录不存在就建。
        #
        # 这里**故意不用 required**：`olares-cli chart lint` 会用默认 values 渲染一遍，
        # required 会让 lint 直接失败，而 lint 是这个包唯一能提前拦住错误的地方。
        # 值真缺的时候，apply 会报 `hostPath.path: Required value` —— 报得够早也够准。
        - name: app
          hostPath:
            path: '{{ .Values.userspace.appData }}'
            type: DirectoryOrCreate
        - name: userspace
          hostPath:
            path: '{{ .Values.userspace.userData }}'
            type: DirectoryOrCreate
        - name: py
          hostPath:
            path: '{{ .Values.py.hostPath }}'
            type: DirectoryOrCreate
