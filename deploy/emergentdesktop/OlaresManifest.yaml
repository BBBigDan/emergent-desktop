# Olares 应用清单。
#
# 字段照抄机器上已装的应用（/olares/rootfs/charts/pvc-charts/navidrome），
# 不是照文档猜的 —— 版本号对不上时安装器会静默拒绝，报错还看不出是哪个字段错。
#
# 两个关键字段，和"裸 Pod"那条路的分界线：
#   · workloadReplicas：告诉安装器这个应用会起哪种 workload（它据此建 entitlement）
#   · permission.userData: Home：允许读用户 Home。没有它，entitlement 不成立，
#     webhook 会在 CREATE deployment 时拒绝（实测原话："You don't have permission
#     to deploy in namespace=..."）
olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  emergentdesktop: 1

metadata:
  appid: emergentdesktop
  categories:
    - System
  tags:
    - desktop
  description: 住在桌面里的那一个：看得见机器、能自己动手、记得做过什么
  # 图标还在设计里，先指到仓库里的占位（Olares 只要求是个能取的 URL）
  icon: https://raw.githubusercontent.com/BBBigDan/emergent-desktop/main/assets/icon.png
  name: emergentdesktop
  title: 涌现式桌面
  version: '0.1.2'

entrances:
  # authLevel: private = 先过 Olares 登录才能进来。它是能读日志、能重启应用的东西，
  # 不能是 public。openMethod: window = 在桌面里开一个窗口，不是新标签页。
  - authLevel: private
    host: emergentdesktop
    name: emergentdesktop
    port: 8788
    title: 涌现式桌面
    openMethod: window
    # agent 自己认 /agent/ 前缀（nginx 不剥），所以入口路径就是它
    path: /agent/

options:
  analytics:
    enabled: false
  dependencies:
    - name: olares
      type: system
      version: '>=1.12.6-0'

permission:
  appData: true      # 程序自己的数据（代码、sessions、usage 账本）
  appCache: true
  userData:
    - Home           # 用户 Home：记忆库、人格种子、Files 里能看到的东西

spec:
  versionName: '0.1.2'
  fullDescription: |
    把 Olares 的桌面壳换成一片连续的粒子场，窗口从粒子长出来；
    另外给你一个**住在这个桌面里**的 agent —— 它看得见机器、能自己动手、
    记得自己做过什么。

    **它能做什么**
    - 读真实读数（CPU / 内存 / 磁盘 / 每个应用）+ 铺成一屏粒子
    - 查日志、重启应用（要你点一下同意）
    - 记住你说过的事，也记得它自己做过的事
    - 内置工具做不到的，它自己写一个装上去

    **它不会做什么**
    - 不碰 secrets / configmaps
    - 改世界的动作一律先弹审批
  upgradeDescription: |
    0.1.0：首个可安装版本。

  # 下面这一组是 v3 清单的**硬要求**（不是描述性字段）：
  # `olares-cli chart lint` 会直接拒绝缺 resources 与 supportArch 的清单。
  # 数字和 templates/deployment.yaml 里的 resources 必须一致 —— 两处不一致时，
  # 用户看到的是"市场说它要 1 核，跑起来被 OOMKilled"，而没人会想到是清单写的。
  developer: emergent-desktop
  website: https://github.com/BBBigDan/emergent-desktop
  sourceCode: https://github.com/BBBigDan/emergent-desktop
  submitter: emergent-desktop
  locale:
    - zh-CN
    - en-US
  limitedCpu: 1300m
  limitedMemory: 1024Mi
  requiredCpu: 40m
  requiredDisk: 200Mi
  requiredMemory: 128Mi
  supportArch:
    - amd64
    - arm64
  # 容器里要用 root 建目录 / 改 hostPath 下的文件（代码目录是 DirectoryOrCreate）。
  # 设 true 时 Olares 会注入 runAsNonRoot，pod 根本起不来。
  runAsUser: false
