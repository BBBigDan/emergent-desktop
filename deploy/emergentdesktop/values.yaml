# chart 的默认值。
#
# `userspace.*` 这几个路径**不给默认值**：它们必须由安装器（或安装脚本）给。
# 猜一个默认值的后果是"装上了、跑起来了、数据写到了错的目录" ——
# 而那种错在界面上看不出来，只有用户去 Files 里翻的时候才发现东西不见了。
workloads:
  emergentdesktop:
    replicaCount: 1

image:
  agent: docker.io/library/node:22-alpine
  memory: docker.io/library/python:3.11-slim
  # 只用来做一件事：在容器起来之前确认代码已经铺好（见 templates/deployment.yaml）
  check: docker.io/library/busybox:1.36

# axolotl 的 wheel（pip --target 装进来的构建产物）。和代码分开：
# 它是集群级的、不随应用版本变，重建记忆服务不需要重装它。
py:
  hostPath: /olares/emergent-py

resources:
  agent:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {cpu: 800m, memory: 512Mi}
  memory:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {cpu: 500m, memory: 512Mi}
