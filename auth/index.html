<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<meta name="build" content="__BUILD__">
<title>Olares</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="./src/style.css?b=__BUILD__">
<script>
  /* 官方桌面/登录注册过 scope=/ 的 Service Worker，会一直喂旧缓存。切到本页先注销一次。 */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then((rs) => {
      rs.filter((r) => (r.scope || '').endsWith('/')).forEach((r) => r.unregister());
    }).catch(() => {});
  }
</script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
  <!-- 头像：真实照片，靠 DOM 渲染；它外面那圈流动的粒子在 canvas 里 -->
  <div id="ava-wrap" class="ava-wrap">
    <img id="ava" class="ava" alt="">
    <span id="ava-letter" class="ava-letter"></span>
  </div>

  <!-- 界面文字与输入框全部是粒子 -->
  <canvas id="scene"></canvas>

  <!-- 唯一存在的 DOM 控件：透明输入框，只负责收键盘（移动端要靠它唤起输入法） -->
  <input id="pw" type="password" name="password" autocomplete="current-password"
         autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="密码">

  <p class="sr-only">Olares 登录。请输入密码后按回车进入桌面。</p>

  <script type="module" src="./src/login.js?b=__BUILD__"></script>
</body>
</html>
