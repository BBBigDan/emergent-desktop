# 打镜像 + 推到 Docker Hub
#
# 为什么在 CI 里打：**集群节点上没有 docker/nerdctl/buildah**（Olares 节点是纯 kubelet
# + containerd），也没有私有仓库，所以"代码 tar 到 hostPath、重启进程"曾经是唯一的路。
# 那条路的代价写在 deploy/README.md 里：镜像版本号不存在、代码不回滚、谁 exec 进去都能改。
# GitHub 的 runner 有 docker —— 这条路什么都没多花。
#
# 为什么是 Docker Hub 不是 ghcr：2026-10-21 实测，这个账号的 GITHUB_TOKEN 推 ghcr
# 在三种命名（平级 / 三段 / 同名仓库）、两种登录名写法下都是
#   denied: permission_denied: The requested installation does not exist
# 而 token 的 `Packages: write` 明明生效了 —— 是账号层的事，不是配置漏了。
# Hub 这边只要仓库 public，集群就能匿名拉，连 imagePullSecret 都不用维护。
#
# 三个镜像而不是一个大镜像：
#   shell   nginx + 静态站            ~60MB
#   agent   node + agent 代码          ~150MB
#   memory  python3.11 + axolotl_rs    ~140MB
# 合成一个（nginx+node+python）要 350MB，每个容器都带着自己用不到的两套运行时。
# 而 k8s 对同一镜像只拉一次，三镜像的额外开销只是一个 manifest 的往返。
name: images

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'shell/**'
      - 'deploy/docker/**'
      - 'deploy/wheels/**'
      - '.dockerignore'
      - '.github/workflows/images.yml'
  workflow_dispatch:

# 连推两次时取消旧的：镜像只有 latest 有用（sha 标签作回滚点），
# 让上一次跑完只是白占 runner 时间。
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 先跑自测。它们是纯 Node 的（零依赖、不连网、不碰集群），十几秒，
  # 盖的正是"最容易一次改坏一片"的东西：截断策略、记忆三条纪律、
  # 人格正交、重试退避、token 账本、造工具的四个 7B 坑、模型表的三态与单价。
  # **用 glob 收全部 `*.test.mjs`，不写死名单** —— 写死的话，新加的自测
  # 默认不跑，而"CI 绿了"会被当成"这份也验过了"。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 自测（agent/*.test.mjs）
        run: |
          set -e
          for f in $(find agent -name '*.test.mjs' | sort); do
            echo "── $f"
            node "$f"
          done

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [shell, agent, memory]
    # 两个 secret（Settings → Secrets and variables → Actions）：
    #   DOCKERHUB_USERNAME  Hub 用户名，同时也是镜像命名空间
    #   DOCKERHUB_TOKEN     Hub 的 Access Token，权限只要 Read & Write
    # 不用 Hub 密码：Access Token 能单独吊销，密码不能。
    #
    # 没配 secret 时**不报错，只构建不推送**：Dockerfile 本身对不对是另一件事，
    # 那件事没配凭据也该被验。配好之后再跑一次就自动开始推。
    env:
      HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      HAS_HUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # 回滚标签用 7 位短 sha：`--tag sha-1a2b3c4` 比 40 位好念，也不容易抄错。
      - id: vars
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: env.HAS_HUB == 'true'
        with:
          username: ${{ env.HUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 没有凭据时：只构建，落到本地名字上（证明 Dockerfile 能跑通）
      - name: 构建 ${{ matrix.image }}（无凭据，不推送）
        if: env.HAS_HUB != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: false
          tags: emergent-desktop-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # 两个标签：
      #   sha-<7>  回滚点。install.sh --tag sha-xxxxxxx 就退回那一版
      #   latest   日常
      - name: 构建并推送 ${{ matrix.image }}
        if: env.HAS_HUB == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          # 只打 amd64：Olares 那台是 x86_64。打 arm64 要多花十分钟换一个没人用的层。
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.HUB_USER }}/emergent-desktop-${{ matrix.image }}:sha-${{ steps.vars.outputs.short }}
            ${{ env.HUB_USER }}/emergent-desktop-${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # 匿名探测：不登录也能取到 manifest，才算"集群拉得到"。
      # Hub 匿名拉取有 100 次/6 小时的限流，我们一次部署三个镜像，离限很远。
      - name: 匿名拉取探测
        if: env.HAS_HUB == 'true'
        env:
          NS: ${{ env.HUB_USER }}
        run: |
          R="$NS/emergent-desktop-${{ matrix.image }}"
          TOK=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$R:pull" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOK" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://registry-1.docker.io/v2/$R/manifests/latest")
          echo "$R → HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::warning::$R 匿名拉不到（$CODE）。集群会 ImagePullBackOff —— 去 Hub 上把这个仓库设成 public。"
          fi
